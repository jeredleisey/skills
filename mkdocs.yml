site_name: cadre
site_url: https://cadre.jeredleisey.com/
repo_url: https://github.com/jeredleisey/skills
docs_dir: cadre/docs
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use the system setting
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - toc:
      title: On this page
extra_css:
  - stylesheets/cadre.css
plugins:
  - search
nav:
  - Home: README.md
  - Tutorials:
      - tutorials/README.md
      - Your first orchestrator: tutorials/first-orchestrator.md
      - Your first orchestrator on Azure DevOps: tutorials/first-orchestrator-ado.md
  - How-to guides:
      - how-to/README.md
      - Do one ticket: how-to/do-one-ticket.md
      - Set up on GitHub: how-to/set-up-on-github.md
      - Set up on Azure DevOps: how-to/set-up-on-azure-devops.md
      - Prepare a Windows computer: how-to/prepare-a-windows-computer.md
      - Use a repo with no remote: how-to/use-a-repo-with-no-remote.md
      - Resume an orchestrator: how-to/resume-an-orchestrator.md
      - Choose a skill pack: how-to/choose-a-skill-pack.md
      - Add an extra card: how-to/add-an-extra-card.md
      - Allow a guard: how-to/allow-a-guard.md
      - Turn on agent teams: how-to/turn-on-agent-teams.md
      - Run the evals: how-to/run-the-evals.md
      - Test a release on Windows 11 (for maintainers): how-to/check-a-windows-install.md
  - Explanation:
      - explanation/README.md
      - The orchestrator model: explanation/orchestrator-model.md
      - Guards, ask and deny: explanation/guards-ask-and-deny.md
      - The tracker is the record: explanation/tracker-is-the-record.md
      - The slim rule: explanation/slim-rule.md
  - Reference:
      - reference/README.md
      - Scripts: reference/scripts.md
      - The charter: reference/charter.md
      - Guards: reference/guards.md
      - The orchestrator item: reference/orchestrator-item.md
      - Presets: reference/presets.md
      - Role cards: reference/role-cards.md
